<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD/Ground Coordinate Shifter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f5; padding: 2rem; color: #18181b; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #27272a; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .radio-group { display: flex; gap: 1rem; margin-bottom: 1rem; padding: 1rem; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; }
        input[type="number"] { width: 100px; padding: 0.5rem; border: 1px solid #d4d4d8; border-radius: 4px; }
        input[type="file"] { display: block; margin-top: 1rem; }
        button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .help-text { font-size: 0.875rem; color: #71717a; margin-top: 0.25rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>CAD/Ground Coordinate Shifter v1.1 2026-09-14</h2>
    
    <div class="form-group">
        <label>1. Select Shift Direction</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="direction" value="cad-to-ground" checked> 
                <strong>CAD-to-Ground</strong><br>
                <span class="help-text">Shifts West (-X) and North (+Y) to cancel out WGS84 export errors for uncontrolled RTK.</span>
            </label>
        </div>
        <div class="radio-group">
            <label>
                <input type="radio" name="direction" value="ground-to-cad"> 
                <strong>Ground-to-CAD</strong><br>
                <span class="help-text">Shifts East (+X) and South (-Y) to match physical field realities in Localized CAD.</span>
            </label>
        </div>
    </div>

    <div class="form-group" style="display: flex; gap: 2rem;">
        <div>
            <label>East/West Shift (ft)</label>
            <input type="number" id="xShift" step="0.01" value="5.00">
        </div>
        <div>
            <label>North/South Shift (ft)</label>
            <input type="number" id="yShift" step="0.01" value="2.25">
        </div>
    </div>

    <div class="form-group">
        <label>2. Upload DXF or KML</label>
        <input type="file" id="fileInput" accept=".dxf,.kml">
    </div>

    <button onclick="processFile()">Process and Download</button>
</div>

<script>
    function processFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert('Please select a file first.');
            return;
        }

        const file = fileInput.files[0];
        const direction = document.querySelector('input[name="direction"]:checked').value;
        
        let xVal = parseFloat(document.getElementById('xShift').value);
        let yVal = parseFloat(document.getElementById('yShift').value);

        // Apply logic: CAD-to-Ground = West(-), North(+) | Ground-to-CAD = East(+), South(-)
        let xShiftFeet = direction === 'cad-to-ground' ? -xVal : xVal;
        let yShiftFeet = direction === 'cad-to-ground' ? yVal : -yVal;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            let outputData = '';

            if (file.name.toLowerCase().endsWith('.kml')) {
                outputData = processKML(text, xShiftFeet, yShiftFeet);
            } else if (file.name.toLowerCase().endsWith('.dxf')) {
                outputData = processDXF(text, xShiftFeet, yShiftFeet);
            } else {
                alert('Unsupported file type. Please use .dxf or .kml');
                return;
            }

            downloadFile('Shifted_' + file.name, outputData);
        };
        reader.readAsText(file);
    }

    function processKML(text, xShiftFeet, yShiftFeet) {
        // Approximate decimal degrees per foot at ~45.33 N Latitude
        const feetPerDegLat = 364522; 
        const feetPerDegLon = 256260; 
        
        const lonShiftDeg = xShiftFeet / feetPerDegLon;
        const latShiftDeg = yShiftFeet / feetPerDegLat;

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "text/xml");
        const coordsNodes = xmlDoc.getElementsByTagName("coordinates");

        for (let i = 0; i < coordsNodes.length; i++) {
            let coordsRaw = coordsNodes[i].textContent.trim().split(/\s+/);
            let newCoords = [];
            
            for (let j = 0; j < coordsRaw.length; j++) {
                let parts = coordsRaw[j].split(',');
                if (parts.length >= 2) {
                    let lon = parseFloat(parts[0]) + lonShiftDeg;
                    let lat = parseFloat(parts[1]) + latShiftDeg;
                    let alt = parts.length > 2 ? ',' + parts[2] : '';
                    newCoords.push(lon.toFixed(8) + ',' + lat.toFixed(8) + alt);
                }
            }
            coordsNodes[i].textContent = newCoords.join(' ');
        }

        const serializer = new XMLSerializer();
        return serializer.serializeToString(xmlDoc);
    }

    function processDXF(text, xShiftFeet, yShiftFeet) {
        const lines = text.split(/\r?\n/);
        
        // Group codes for spatial X and Y coordinates (Start, End, Center, Insertion, Vertex, etc.)
        const xCodes = ['10', '11', '12', '13', '14'];
        const yCodes = ['20', '21', '22', '23', '24'];
        
        let inTargetSection = false;
        
        // Iterate by 2 because DXF format strictly alternates: Group Code, then Value
        for (let i = 0; i < lines.length - 1; i += 2) {
            let code = lines[i].trim();
            let valStr = lines[i + 1];
            let valTrim = valStr.trim();
            
            // Check if we are entering a new SECTION
            if (code === '0' && valTrim === 'SECTION') {
                // The section name is always located 3 lines down from the '0'
                let sectionName = lines[i + 3] ? lines[i + 3].trim() : '';
                // Only enable shifting if we are entering ENTITIES or BLOCKS
                inTargetSection = (sectionName === 'ENTITIES' || sectionName === 'BLOCKS');
            } 
            // Turn off shifting if we hit the end of the file or exit a section
            else if (code === '0' && valTrim === 'EOF') {
                inTargetSection = false;
            }

            // Only modify geometry if we are safely inside the correct sections
            if (inTargetSection) {
                if (xCodes.includes(code)) {
                    let val = parseFloat(valStr);
                    if (!isNaN(val)) lines[i + 1] = (val + xShiftFeet).toFixed(6);
                } else if (yCodes.includes(code)) {
                    let val = parseFloat(valStr);
                    if (!isNaN(val)) lines[i + 1] = (val + yShiftFeet).toFixed(6);
                }
            }
        }
        return lines.join('\n');
    }

    function downloadFile(filename, text) {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
</script>

</body>
</html>
