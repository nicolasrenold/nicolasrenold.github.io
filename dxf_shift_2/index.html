<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD/Ground Coordinate Shifter</title>
    <!-- Importing Decimal.js for arbitrary-precision decimal arithmetic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f5; padding: 2rem; color: #18181b; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #27272a; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .radio-group { display: flex; gap: 1rem; margin-bottom: 1rem; padding: 1rem; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; }
        input[type="number"] { width: 120px; padding: 0.5rem; border: 1px solid #d4d4d8; border-radius: 4px; font-size: 1rem; }
        input[type="file"] { display: block; margin-top: 1rem; }
        button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .help-text { font-size: 0.875rem; color: #71717a; margin-top: 0.25rem; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <h2>CAD/Ground Coordinate Shifter v1.4</h2>
    
    <div class="form-group">
        <label>1. Select Workflow (Auto-fills the correct +/- signs)</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="direction" value="cad-to-ground" onchange="updatePresets()" checked> 
                <strong>CAD-to-Ground (WGS84 Export)</strong><br>
                <span class="help-text">Auto-fills: West (-5) and North (+2.25) to fix export drift.</span>
            </label>
        </div>
        <div class="radio-group">
            <label>
                <input type="radio" name="direction" value="ground-to-cad" onchange="updatePresets()"> 
                <strong>Ground-to-CAD (Localized DXF)</strong><br>
                <span class="help-text">Auto-fills: East (+5) and South (-2.25) to match physical field reality.</span>
            </label>
        </div>
    </div>

    <div class="form-group" style="display: flex; gap: 2rem; background: #fffbeb; padding: 1rem; border: 1px solid #fde68a; border-radius: 6px;">
        <div>
            <label>X-Axis Shift (ft)<br>
            <span class="help-text">Positive (+) = East<br>Negative (-) = West</span>
            </label>
            <input type="number" id="xShift" step="0.01" value="-5.10">
        </div>
        <div>
            <label>Y-Axis Shift (ft)<br>
            <span class="help-text">Positive (+) = North<br>Negative (-) = South</span>
            </label>
            <input type="number" id="yShift" step="0.01" value="2.25">
        </div>
    </div>

    <div class="form-group">
        <label>2. Upload DXF or KML</label>
        <input type="file" id="fileInput" accept=".dxf,.kml">
    </div>

    <button onclick="processFile()">Process and Download</button>
</div>

<script>
    function updatePresets() {
        const direction = document.querySelector('input[name="direction"]:checked').value;
        if (direction === 'cad-to-ground') {
            document.getElementById('xShift').value = -5.10;
            document.getElementById('yShift').value = 2.25;
        } else {
            document.getElementById('xShift').value = 5.10;
            document.getElementById('yShift').value = -2.25;
        }
    }

    function detectEOL(text) {
        if (text.includes('\r\n')) return '\r\n';
        if (text.includes('\n')) return '\n';
        if (text.includes('\r')) return '\r';
        return '\n';
    }

    function getDecimalCount(numStr) {
        const parts = numStr.split('.');
        return parts.length > 1 ? parts[1].length : 0;
    }

    function processFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert('Please select a file first.');
            return;
        }

        const file = fileInput.files[0];
        
        let xShiftFeet = document.getElementById('xShift').value;
        let yShiftFeet = document.getElementById('yShift').value;

        if (isNaN(parseFloat(xShiftFeet)) || isNaN(parseFloat(yShiftFeet))) {
            alert('Please ensure valid numbers are entered for the shift values.');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const originalEOL = detectEOL(text);
            let outputData = '';

            if (file.name.toLowerCase().endsWith('.kml')) {
                outputData = processKML(text, xShiftFeet, yShiftFeet);
                outputData = outputData.replace(/\r\n|\n|\r/g, originalEOL);
            } else if (file.name.toLowerCase().endsWith('.dxf')) {
                outputData = processDXF(text, xShiftFeet, yShiftFeet, originalEOL);
            } else {
                alert('Unsupported file type. Please use .dxf or .kml');
                return;
            }

            downloadFile('Shifted_' + file.name, outputData);
        };
        reader.readAsText(file);
    }

    function processKML(text, xShiftFeet, yShiftFeet) {
        const feetPerDegLat = new Decimal(364522); 
        const feetPerDegLon = new Decimal(256260); 
        
        const lonShiftDeg = new Decimal(xShiftFeet).dividedBy(feetPerDegLon);
        const latShiftDeg = new Decimal(yShiftFeet).dividedBy(feetPerDegLat);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "text/xml");
        const coordsNodes = xmlDoc.getElementsByTagName("coordinates");

        for (let i = 0; i < coordsNodes.length; i++) {
            let coordsRaw = coordsNodes[i].textContent.trim().split(/\s+/);
            let newCoords = [];
            
            for (let j = 0; j < coordsRaw.length; j++) {
                let parts = coordsRaw[j].split(',');
                if (parts.length >= 2) {
                    let origLonStr = parts[0];
                    let origLatStr = parts[1];
                    
                    let lonDecimals = getDecimalCount(origLonStr);
                    let latDecimals = getDecimalCount(origLatStr);
                    
                    // Do not shift if coordinate is absolute zero
                    let newLon = (new Decimal(origLonStr).isZero()) ? origLonStr : new Decimal(origLonStr).plus(lonShiftDeg).toFixed(lonDecimals);
                    let newLat = (new Decimal(origLatStr).isZero()) ? origLatStr : new Decimal(origLatStr).plus(latShiftDeg).toFixed(latDecimals);
                    
                    let alt = parts.length > 2 ? ',' + parts[2] : '';
                    newCoords.push(newLon + ',' + newLat + alt);
                }
            }
            coordsNodes[i].textContent = newCoords.join(' ');
        }

        const serializer = new XMLSerializer();
        return serializer.serializeToString(xmlDoc);
    }

    function processDXF(text, xShiftFeet, yShiftFeet, eol) {
        const lines = text.split(/\r?\n|\r/); 
        const xCodes = ['10', '11', '12', '13', '14'];
        const yCodes = ['20', '21', '22', '23', '24'];
        let inTargetSection = false;
        
        const shiftX = new Decimal(xShiftFeet);
        const shiftY = new Decimal(yShiftFeet);
        
        for (let i = 0; i < lines.length - 1; i += 2) {
            let code = lines[i].trim();
            let valStr = lines[i + 1];
            
            if (valStr === undefined) break; 
            
            let valTrim = valStr.trim();
            
            if (code === '0' && valTrim === 'SECTION') {
                let sectionName = lines[i + 3] ? lines[i + 3].trim() : '';
                inTargetSection = (sectionName === 'ENTITIES' || sectionName === 'BLOCKS');
            } 
            else if (code === '0' && valTrim === 'EOF') {
                inTargetSection = false;
            }

            if (inTargetSection) {
                if (xCodes.includes(code)) {
                    let decimals = getDecimalCount(valTrim);
                    try {
                        let val = new Decimal(valTrim);
                        // Dummy vertex protection
                        if (!val.isZero()) {
                            lines[i + 1] = val.plus(shiftX).toFixed(decimals);
                        }
                    } catch(err) {
                        // Ignore if unparseable
                    }
                } else if (yCodes.includes(code)) {
                    let decimals = getDecimalCount(valTrim);
                    try {
                        let val = new Decimal(valTrim);
                        // Dummy vertex protection
                        if (!val.isZero()) {
                            lines[i + 1] = val.plus(shiftY).toFixed(decimals);
                        }
                    } catch(err) {
                        // Ignore if unparseable
                    }
                }
            }
        }
        
        return lines.join(eol); 
    }

    function downloadFile(filename, text) {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
</script>

</body>
</html>
